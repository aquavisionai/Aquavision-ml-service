name: Service checks
"on": [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements-cpu.txt -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: docker build --tag aquavision-ml-service:ci .
